syntax = "proto3";

package adsops.v1;

import "google/protobuf/timestamp.proto";

message NodeInfo {
  string name = 1;
  string role = 2;
  string status = 3;
  string version = 4;
}

message NamespaceInfo {
  string name = 1;
  int32 total_pods = 2;
  int32 running_pods = 3;
}

message K3sStats {
  google.protobuf.Timestamp timestamp = 1;
  bool available = 2;
  string node_name = 3;
  int32 total_nodes = 4;
  int32 ready_nodes = 5;
  int32 total_pods = 6;
  int32 running_pods = 7;
  int32 failed_pods = 8;
  repeated NodeInfo nodes = 9;
  repeated NamespaceInfo namespaces = 10;
}
