[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsops"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.21",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "asyncssh>=2.22",
    "psutil>=7.0",
    "protobuf>=5.26",
    "rich>=13.0",
    "aiohttp>=3.9",
    "adsops-proto",
]

[project.scripts]
adsops = "adsops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
